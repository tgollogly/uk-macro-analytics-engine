# Cloudflare Workers + Static Assets — serves static-site/ (see docs/CLOUDFLARE_STATIC.md).
# New project name (do not reuse an existing Worker): deploy with
#   npx wrangler deploy
# Preview URL is assigned by Cloudflare; custom hostname is optional and separate.
name = "uk-macro-analytics-landing"
main = "workers/static-landing.js"
compatibility_date = "2025-11-06"

[assets]
directory = "static-site"
binding = "ASSETS"
