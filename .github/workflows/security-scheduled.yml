name: Security (scheduled)

# Weekday daytime UK (documented): cron uses UTC.
# 0 10 * * 1-5  => 10:00 UTC Mon–Fri = 10:00 GMT (winter) / 11:00 BST (summer).
# GitHub does not apply Europe/London DST to cron — adjust manually if you need a fixed local hour.
on:
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  python-security:
    name: Python dependency & repo scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scan tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Repository security_audit.py
        run: python src/security_audit.py
      - name: pip-audit
        run: pip-audit -r requirements.txt --no-deps --disable-pip

  npm-security:
    name: npm audit (ats-api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/ats-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: workers/ats-api/package-lock.json
      - run: npm ci
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL (Python + JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript, python
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:all
