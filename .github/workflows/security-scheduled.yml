name: Security (scheduled)

# Once per week: Tuesday 10:00 UTC (weekday daytime).
# UK civil time: 10:00 GMT (winter) / 11:00 BST (summer) — GitHub cron is UTC-only.
# Dependabot also opens weekly PRs (Tuesday Europe/London); this workflow is vulnerability drift only.
on:
  schedule:
    - cron: "0 10 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    name: Python dependency & repo scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project dependencies (resolved closure)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Repository security_audit.py
        run: python src/security_audit.py
      - name: pip-audit (installed environment, includes transitives)
        run: pip-audit --progress-spinner=off

  npm-security:
    name: npm audit (ats-api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/ats-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: workers/ats-api/package-lock.json
      - run: npm ci
      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (devDependencies)
        run: npm audit --only=dev --audit-level=high

  codeql:
    name: CodeQL (Python + JavaScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript, python
          queries: +security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: security-scheduled
