name: CI

on:
  push:
    branches: ["main", "**"]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install --upgrade pip && pip install ruff==0.8.4
      - name: Ruff check
        run: python -m ruff check src tests tools streamlit_app.py

  python-test:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile check
        run: python -m compileall -q src tests streamlit_app.py
      - name: Pytest
        run: pytest -q --tb=short

  python-security:
    name: Python security (audit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project dependencies (resolved closure)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Repository security_audit.py
        run: python src/security_audit.py
      - name: pip-audit (installed environment, includes transitives)
        run: pip-audit --progress-spinner=off

  workers-ats-api:
    name: Workers ATS API (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/ats-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: workers/ats-api/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (devDependencies)
        run: npm audit --only=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
