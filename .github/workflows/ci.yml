name: CI

on:
  push:
    branches: ["main", "**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check src tests tools streamlit_app.py

      - name: Security audit
        run: python src/security_audit.py

      - name: Dependency vulnerability scan (PyPI/OSV)
        # Resolve each pinned line against PyPI without a venv (--no-deps --disable-pip).
        run: pip-audit -r requirements.txt --no-deps --disable-pip

      - name: Compile check
        run: python -m compileall -q src tests streamlit_app.py

      - name: Run tests
        run: pytest -q --tb=short

  workers-ats-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/ats-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: workers/ats-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
