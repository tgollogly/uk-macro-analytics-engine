name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Create source zip
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          git archive --format=zip --output="dist/uk-macro-analytics-engine-${VERSION}-source.zip" "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: python-packages
          path: dist/

  build-npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/ats-api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd0f16d962e42 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: workers/ats-api/package-lock.json
      - name: npm pack
        run: |
          npm ci
          mkdir -p ../../dist
          npm pack --pack-destination ../../dist
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: npm-package
          path: dist/*.tgz

  publish:
    needs: [build-python, build-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          pattern: "*"
          path: artifacts
          merge-multiple: true
      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' -o -name '*.zip' -o -name '*.tgz' \) -exec cp -v {} dist/ \;
          ls -la dist/
      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          files=(./*.whl ./*.tar.gz ./*.zip ./*.tgz)
          if ((${#files[@]} == 0)); then
            echo "No release binaries staged" >&2
            exit 1
          fi
          sha256sum "${files[@]}" | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*
      - name: Extract CHANGELOG release notes
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "No CHANGELOG section for ${VERSION}" >&2
            exit 1
          fi
          {
            echo
            echo '🔒 These files are sealed: SHA-256 checksums in SHA256SUMS.txt plus GitHub build attestations. See the README "Verify your download" section to check them.'
          } >> release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@7b4da11513bf3f43f9999e90eabced41ab8bb048 # v2.2.0
        with:
          body_path: release-notes.md
          files: |
            dist/*
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true