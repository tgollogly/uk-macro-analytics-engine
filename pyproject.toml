[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-macro-analytics-engine"
version = "0.1.0"
description = "UK open macro data pipeline — validation, Parquet cache, DuckDB analytics, Streamlit dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Thomas Gollogly" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "duckdb>=1.5.0",
  "pandas>=2.3.0",
  "pyarrow>=23.0.0",
  "requests>=2.32.0",
  "streamlit>=1.67.0",
  "plotly>=5.24.0",
  "pillow>=13.0.0",
  "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]