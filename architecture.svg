<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240" role="img" aria-label="Pipeline: Ingestion to DuckDB to Analytics to Exports">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="820" y2="240">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="820" height="240" fill="url(#bg)" rx="12"/>
  <text x="24" y="36" fill="#f8fafc" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600">Architecture</text>
  <text x="24" y="56" fill="#94a3b8" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11">SVG preview (works where Mermaid is not supported)</text>

  <rect x="24" y="76" width="180" height="140" rx="8" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="114" y="100" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Ingestion</text>
  <rect x="36" y="112" width="156" height="28" rx="4" fill="#334155" filter="url(#shadow)"/>
  <text x="114" y="131" text-anchor="middle" fill="#f1f5f9" font-family="system-ui,sans-serif" font-size="10">config + requests</text>
  <rect x="36" y="148" width="156" height="28" rx="4" fill="#334155"/>
  <text x="114" y="167" text-anchor="middle" fill="#f1f5f9" font-family="system-ui,sans-serif" font-size="10">data_fetcher</text>
  <rect x="36" y="184" width="156" height="24" rx="4" fill="#334155"/>
  <text x="114" y="200" text-anchor="middle" fill="#f1f5f9" font-family="system-ui,sans-serif" font-size="10">Parquet cache</text>

  <path d="M 210 142 L 256 142" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <rect x="260" y="76" width="180" height="140" rx="8" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="350" y="100" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Storage</text>
  <rect x="272" y="118" width="156" height="40" rx="4" fill="#334155"/>
  <text x="350" y="138" text-anchor="middle" fill="#f1f5f9" font-family="system-ui,sans-serif" font-size="10">DuckDB</text>
  <text x="350" y="152" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="9">db_engine + views</text>
  <rect x="272" y="170" width="156" height="38" rx="4" fill="#334155"/>
  <text x="350" y="188" text-anchor="middle" fill="#f1f5f9" font-family="system-ui,sans-serif" font-size="10">v_cpih_core</text>
  <text x="350" y="200" text-anchor="middle" fill="#f1f5f9" font-family="system-ui,sans-serif" font-size="10">v_psnb_monthly</text>

  <path d="M 442 142 L 488 142" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <rect x="492" y="76" width="160" height="140" rx="8" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="572" y="100" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Analytics</text>
  <rect x="504" y="118" width="136" height="52" rx="4" fill="#334155"/>
  <text x="572" y="140" text-anchor="middle" fill="#f1f5f9" font-family="system-ui,sans-serif" font-size="10">analytics.py</text>
  <text x="572" y="158" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="9">rolling windows, YoY</text>
  <rect x="504" y="182" width="136" height="26" rx="4" fill="#334155"/>
  <text x="572" y="199" text-anchor="middle" fill="#f1f5f9" font-family="system-ui,sans-serif" font-size="10">Parquet + JSON out</text>

  <path d="M 654 142 L 700 142" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <rect x="702" y="100" width="96" height="92" rx="8" fill="#14532d" stroke="#22c55e"/>
  <text x="750" y="128" text-anchor="middle" fill="#ecfccb" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Exports</text>
  <text x="750" y="152" text-anchor="middle" fill="#bbf7d0" font-family="system-ui,sans-serif" font-size="9">data/exports/</text>
</svg>
