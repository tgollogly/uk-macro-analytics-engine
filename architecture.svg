<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 2000" width="720" height="2000" role="img" aria-label="Architecture pipeline: top to bottom, Ingestion through Exports">
  <rect width="720" height="2000" rx="20" fill="#f8fafc" stroke="#0f766e" stroke-width="4"/>
  <text x="40" y="56" fill="#0f172a" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="32" font-weight="700">Architecture</text>
  <text x="40" y="96" fill="#475569" font-family="system-ui,sans-serif" font-size="20">Poster layout · matches generated PNG · vector: architecture.svg</text>

  <!-- Ingestion -->
  <rect x="40" y="130" width="640" height="340" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
  <text x="360" y="178" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="26" font-weight="700">Ingestion</text>
  <text x="360" y="230" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="22">config + requests</text>
  <text x="360" y="270" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="22">data_fetcher</text>
  <text x="360" y="310" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="22">Parquet cache</text>
  <text x="360" y="350" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="22">ONS CSV → validated Parquet</text>
  <path d="M 360 480 L 360 530" stroke="#0d9488" stroke-width="6" fill="none"/>
  <polygon points="360,545 350,525 370,525" fill="#0d9488"/>

  <!-- Storage -->
  <rect x="40" y="555" width="640" height="380" rx="16" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
  <text x="360" y="608" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="26" font-weight="700">Storage</text>
  <text x="360" y="660" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="22">DuckDB</text>
  <text x="360" y="704" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="21">db_engine + views</text>
  <text x="360" y="748" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="21">v_cpih_core</text>
  <text x="360" y="792" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="21">v_psnb_monthly</text>
  <text x="360" y="836" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="21">SQL views over Parquet</text>
  <path d="M 360 940 L 360 990" stroke="#0d9488" stroke-width="6" fill="none"/>
  <polygon points="360,1005 350,985 370,985" fill="#0d9488"/>

  <!-- Analytics -->
  <rect x="40" y="1015" width="640" height="340" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
  <text x="360" y="1065" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="26" font-weight="700">Analytics</text>
  <text x="360" y="1118" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="22">analytics.py</text>
  <text x="360" y="1162" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="22">rolling · YoY</text>
  <text x="360" y="1206" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="22">Parquet + JSON</text>
  <text x="360" y="1250" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="22">metrics for dashboards / exports</text>
  <path d="M 360 1370 L 360 1420" stroke="#0d9488" stroke-width="6" fill="none"/>
  <polygon points="360,1435 350,1415 370,1415" fill="#0d9488"/>

  <!-- Exports -->
  <rect x="40" y="1445" width="640" height="300" rx="16" fill="#dcfce7" stroke="#166534" stroke-width="3"/>
  <text x="360" y="1495" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="26" font-weight="700">Exports</text>
  <text x="360" y="1548" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="22">data/exports/</text>
  <text x="360" y="1592" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="22">CSV · JSON · Parquet</text>
  <text x="360" y="1636" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="22">report + optional Streamlit</text>
</svg>
