<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Architecture pipeline: Ingestion to Exports">
  <rect width="1000" height="320" rx="16" fill="#f8fafc" stroke="#0f766e" stroke-width="3"/>
  <text x="40" y="46" fill="#0f172a" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="700">Architecture</text>
  <text x="40" y="74" fill="#475569" font-family="system-ui,sans-serif" font-size="14">Flat high-contrast for README &amp; mobile · matches generated PNG</text>

  <!-- Ingestion -->
  <rect x="40" y="98" width="200" height="190" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="140" y="126" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Ingestion</text>
  <text x="140" y="152" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="13">config + requests</text>
  <text x="140" y="176" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="13">data_fetcher</text>
  <text x="140" y="200" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="13">Parquet cache</text>

  <path d="M 248 180 L 278 180" stroke="#0d9488" stroke-width="4" fill="none"/>
  <polygon points="278,180 264,170 264,190" fill="#0d9488"/>

  <!-- Storage -->
  <rect x="290" y="98" width="200" height="190" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="390" y="126" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Storage</text>
  <text x="390" y="152" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="13">DuckDB</text>
  <text x="390" y="176" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="12">db_engine + views</text>
  <text x="390" y="198" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="12">v_cpih_core</text>
  <text x="390" y="220" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="12">v_psnb_monthly</text>

  <path d="M 498 180 L 528 180" stroke="#0d9488" stroke-width="4" fill="none"/>
  <polygon points="528,180 514,170 514,190" fill="#0d9488"/>

  <!-- Analytics -->
  <rect x="540" y="98" width="200" height="190" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="640" y="126" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Analytics</text>
  <text x="640" y="155" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="13">analytics.py</text>
  <text x="640" y="182" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="13">rolling · YoY</text>
  <text x="640" y="209" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="13">Parquet + JSON</text>

  <path d="M 748 180 L 778 180" stroke="#0d9488" stroke-width="4" fill="none"/>
  <polygon points="778,180 764,170 764,190" fill="#0d9488"/>

  <!-- Exports -->
  <rect x="790" y="118" width="170" height="150" rx="12" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="875" y="150" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Exports</text>
  <text x="875" y="182" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="13">data/exports/</text>
  <text x="875" y="208" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="13">CSV · JSON · Parquet</text>
</svg>
